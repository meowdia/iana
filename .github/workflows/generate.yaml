name: Generate IANA registries

on:
  push:
    branches-ignore:
      - 'automation/iana/**'

concurrency:
  group: iana-generate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - uses: cachix/install-nix-action@v31

      - name: Generate and check
        run: |
          nix develop --command bash -euc '
            cargo run --locked -p xtask -- iana update
            just iana-check
            just check
          '

      - name: Generation date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/iana/${{ github.ref_name }}
          base: ${{ github.ref_name }}
          delete-branch: true
          add-paths: |
            Cargo.toml
            iana/catalog.txt
            src/
          commit-message: 'chore: regenerate IANA registries (${{ steps.date.outputs.date }})'
          title: 'chore: regenerate IANA registries (${{ steps.date.outputs.date }})'
          body: Registry catalog and Rust code regenerated by GitHub Actions.
