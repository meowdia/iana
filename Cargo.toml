[package]
name = "iana-gen-shared"
version = "0.1.0"
edition = "2024"
description = "Type-safe Rust bindings generated from IANA protocol parameter registries."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/meowdia/iana"
keywords = ["iana", "protocol", "registry", "networking"]
categories = ["network-programming"]

[workspace]
members = [
    "xtask",
    # BEGIN GENERATED FAMILY MEMBERS
    "crates/acme",
    "crates/address-family-numbers",
    "crates/aead-parameters",
    "crates/amtrelay-resource-record",
    "crates/audio-telephone-event-registry",
    "crates/authentication",
    "crates/cdni-parameters",
    "crates/cert-rr-types",
    "crates/channel-binding-types",
    "crates/character-sets",
    "crates/comp-meth-ids",
    "crates/cont-disp",
    "crates/content-security-policy-directives",
    "crates/cookie-attribute-names",
    "crates/dane-parameters",
    "crates/dcep-parameters",
    "crates/dns",
    "crates/ds-rr-types",
    "crates/dscp-registry",
    "crates/ebml",
    "crates/flac",
    "crates/hash-function-text-names",
    "crates/hpke",
    "crates/http",
    "crates/ice",
    "crates/internet-date-time-format",
    "crates/ipseckey-rr-parameters",
    "crates/jose",
    "crates/jwt",
    "crates/language",
    "crates/link-relations",
    "crates/locally-served-dns-zones",
    "crates/matroska",
    "crates/media",
    "crates/mls",
    "crates/ntp-parameters",
    "crates/oauth-parameters",
    "crates/opus-channel-mapping-families",
    "crates/passport",
    "crates/pkix-parameters",
    "crates/protocol-numbers",
    "crates/quic",
    "crates/rtcp",
    "crates/rtp-parameters",
    "crates/rtsp-parameters",
    "crates/rtspv2-parameters",
    "crates/sctp-parameters",
    "crates/sdp",
    "crates/service",
    "crates/sframe",
    "crates/sig-alg-numbers",
    "crates/sip",
    "crates/special",
    "crates/srtp-protection",
    "crates/stun-parameters",
    "crates/tcp",
    "crates/tel-uri-parameters",
    "crates/tls",
    "crates/top-level-media-types",
    "crates/trans",
    "crates/tsig-algorithm-names",
    "crates/udp",
    "crates/uri-schemes",
    "crates/uuid",
    "crates/wave-avi-codec-registry",
    "crates/webpush-parameters",
    "crates/websocket",
    "crates/well-known-uris",
    "crates/whip",
    # END GENERATED FAMILY MEMBERS
]
resolver = "3"

[workspace.package]
version = "0.1.0"
repository = "https://github.com/meowdia/iana"

[workspace.dependencies]
iana = { package = "iana-gen-shared", path = ".", version = "0.1.0" }

[lints]
workspace = true

[workspace.lints.rust]
redundant_imports = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"

[workspace.lints.clippy]
as_ptr_cast_mut = "deny"
branches_sharing_code = "deny"
clear_with_drain = "deny"
collection_is_never_read = "deny"
debug_assert_with_mut_call = "deny"
derive_partial_eq_without_eq = "deny"
equatable_if_let = "deny"
fallible_impl_from = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
iter_with_drain = "deny"
large_stack_frames = "deny"
missing_const_for_fn = "deny"
mutex_integer = "deny"
needless_collect = "deny"
needless_for_each = "deny"
needless_pass_by_ref_mut = "deny"
nonstandard_macro_braces = "deny"
option_if_let_else = "deny"
or_fun_call = "deny"
path_buf_push_overwrite = "deny"
read_zero_byte_vec = "deny"
redundant_clone = "deny"
redundant_pub_crate = "deny"
semicolon_if_nothing_returned = "deny"
set_contains_or_insert = "deny"
significant_drop_in_scrutinee = "deny"
suboptimal_flops = "deny"
suspicious_operation_groupings = "deny"
trailing_empty_array = "deny"
undocumented_unsafe_blocks = "deny"
uninlined_format_args = "deny"
use_self = "deny"

[features]
default = []
metadata = []
